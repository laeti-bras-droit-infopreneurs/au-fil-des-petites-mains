media:
  input: src/assets/img
  output: assets/img

content:
  - name: infos
    label: "⚙️ Coordonnées & horaires"
    description: "Coordonnées, horaires et réseaux sociaux affichés sur tout le site."
    type: file
    path: src/_data/site.json
    fields:
      - { name: nom, label: "Nom de l'entreprise", type: string }
      - { name: proprietaire, label: "Nom de la propriétaire", type: string }
      - { name: email, label: "E-mail", type: string }
      - { name: telephone, label: "Téléphone (affiché)", type: string }
      - { name: telephone_lien, label: "Téléphone (format international, ex. +33607773886)", type: string }
      - { name: adresse_ligne1, label: "Adresse — ligne 1", type: string }
      - { name: adresse_ligne2, label: "Adresse — ligne 2 (code postal, ville)", type: string }
      - { name: instagram, label: "Lien Instagram", type: string }
      - { name: facebook, label: "Lien Facebook", type: string }
      - { name: horaires_semaine, label: "Horaires en semaine", type: string }
      - { name: horaires_samedi, label: "Horaires le samedi", type: string }
      - { name: horaires_note, label: "Note horaires (ex. uniquement sur RDV)", type: string }
      - { name: copyright, label: "Ligne de copyright (pied de page)", type: string }

  - name: accueil
    label: "🏠 Page Accueil"
    type: file
    path: src/_data/accueil.json
    fields:
      - { name: hero_titre, label: "Grand titre", type: string }
      - { name: hero_script, label: "Accroche calligraphiée (ex. Artisane Couturière à Campagne)", type: string }
      - { name: hero_texte1, label: "Présentation — paragraphe 1", type: text }
      - { name: hero_texte2, label: "Présentation — paragraphe 2", type: text }
      - { name: hero_texte3, label: "Présentation — paragraphe 3", type: text }
      - { name: hero_image, label: "Photo principale", type: image }
      - { name: services_titre, label: "Section services — titre", type: string }
      - name: services
        label: "Les 3 services (cartes cliquables)"
        type: object
        list: true
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: image, label: "Photo", type: image }
          - { name: lien, label: "Page liée (ex. retouches.html)", type: string }
      - { name: agenda_titre, label: "Agenda — titre", type: string }
      - { name: agenda_image, label: "Agenda — affiche / visuel", type: image }
      - name: agenda_lignes
        label: "Agenda — lignes de dates"
        description: "Coche « Mettre en évidence » pour les intitulés (souligné et en rose foncé)."
        type: object
        list: true
        fields:
          - { name: texte, label: "Texte", type: string }
          - { name: souligne, label: "Mettre en évidence", type: boolean }
      - { name: agenda_note, label: "Agenda — note finale", type: text }
      - { name: labels_titre, label: "Section labels — titre", type: string }
      - { name: labels_texte, label: "Section labels — texte", type: text }

  - name: retouches
    label: "🧵 Page Retouches"
    type: file
    path: src/_data/retouches.json
    fields:
      - { name: titre, label: "Titre de la page", type: string }
      - { name: entete_script, label: "Sous-titre calligraphié", type: string }
      - { name: image, label: "Photo", type: image }
      - { name: intro_titre, label: "Titre d'introduction", type: string }
      - { name: paragraphes, label: "Texte de présentation (un paragraphe par ligne)", type: text, list: true }
      - { name: contact_note, label: "Phrase mise en avant sous le tableau", type: string }
      - { name: tarifs_script, label: "Tarifs — mot calligraphié", type: string }
      - { name: tarifs_titre, label: "Tarifs — titre du tableau", type: string }
      - name: tarifs
        label: "Tableau des tarifs"
        description: "Utilise la poignée à gauche pour réordonner, le + pour ajouter une prestation."
        type: object
        list: true
        fields:
          - { name: prestation, label: "Prestation", type: string }
          - { name: tarif, label: "Tarif (ex. 10 €)", type: string }
      - { name: tarifs_note, label: "Tarifs — note sous le tableau", type: text }
      - { name: bonus_script, label: "Bonus Réparation — mot calligraphié", type: string }
      - { name: bonus_titre, label: "Bonus Réparation — titre", type: string }
      - { name: bonus_texte1, label: "Bonus Réparation — paragraphe 1", type: text }
      - { name: bonus_texte2, label: "Bonus Réparation — paragraphe 2", type: text }
      - { name: atelier_titre, label: "Atelier — titre", type: string }
      - { name: atelier_texte, label: "Atelier — texte", type: text }

  - name: broderie
    label: "🪡 Page Broderies"
    type: file
    path: src/_data/broderie.json
    fields:
      - { name: titre, label: "Titre de la page", type: string }
      - { name: entete_script, label: "Sous-titre calligraphié", type: string }
      - { name: image, label: "Photo principale", type: image }
      - { name: intro_titre, label: "Titre d'introduction", type: string }
      - { name: intro_texte, label: "Texte d'introduction", type: text }
      - name: atouts
        label: "Les atouts (Pour tous les événements, Qualité…)"
        type: object
        list: true
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", type: text }
      - { name: galerie_pro_titre, label: "Galerie pro — titre", type: string }
      - { name: galerie_pro_texte, label: "Galerie pro — texte", type: text }
      - name: galerie_pro
        label: "Galerie — entreprises & associations"
        type: object
        list: true
        fields:
          - { name: image, label: "Photo", type: image }
          - { name: legende, label: "Légende (sert aussi au référencement)", type: string }
      - { name: galerie_cadeau_titre, label: "Galerie cadeaux — titre", type: string }
      - { name: galerie_cadeau_texte, label: "Galerie cadeaux — texte", type: text }
      - name: galerie_cadeau
        label: "Galerie — cadeaux personnalisés"
        type: object
        list: true
        fields:
          - { name: image, label: "Photo", type: image }
          - { name: legende, label: "Légende (sert aussi au référencement)", type: string }
      - { name: tarifs_titre, label: "Tarifs — titre", type: string }
      - { name: tarifs, label: "Tarifs — principes (liste)", type: text, list: true }
      - { name: tarifs_exemple, label: "Tarifs — exemple chiffré", type: text }
      - { name: tarifs_contact, label: "Tarifs — phrase de contact", type: text }

  - name: cours
    label: "✂️ Page Cours"
    type: file
    path: src/_data/cours.json
    fields:
      - { name: titre, label: "Titre de la page", type: string }
      - { name: entete_script, label: "Sous-titre calligraphié", type: string }
      - { name: image, label: "Photo", type: image }
      - { name: intro_paragraphes, label: "Introduction (un paragraphe par ligne)", type: text, list: true }
      - { name: possibilites, label: "Les possibilités proposées (liste)", type: text, list: true }
      - { name: projets_titre, label: "Projets — titre", type: string }
      - name: projets
        label: "Les projets au choix"
        type: object
        list: true
        fields:
          - { name: titre, label: "Nom du projet", type: string }
          - { name: image, label: "Photo du projet", type: image }
      - { name: projets_note, label: "Projets — phrase calligraphiée finale", type: string }
      - { name: materiel_titre, label: "Matériel — titre", type: string }
      - name: materiel
        label: "Matériel par projet"
        type: object
        list: true
        fields:
          - { name: titre, label: "Projet", type: string }
          - { name: items, label: "Fournitures", type: text, list: true }
      - { name: avant_titre, label: "« Avant de couper » — titre", type: string }
      - { name: avant_items, label: "« Avant de couper » — points", type: text, list: true }
      - { name: conseils_titre, label: "Conseils — titre", type: string }
      - { name: conseils, label: "Conseils — points", type: text, list: true }
      - { name: tarifs_titre, label: "Tarifs — titre", type: string }
      - name: tarifs_image
        label: "Tarifs — image de la grille (JPG ou PNG)"
        description: "Facultatif. Dépose ici la photo ou l'image de ta grille tarifaire quand elle sera prête : elle s'affichera automatiquement sous le titre. Laisse vide pour ne rien afficher."
        type: image
      - { name: tarifs_note, label: "Tarifs — phrase calligraphiée (ex. Pensez à la carte cadeau !)", type: string }
      - { name: horaires_titre, label: "Horaires — titre", type: string }
      - { name: groupe_titre, label: "Cours collectifs — titre", type: string }
      - { name: groupe_texte, label: "Cours collectifs — horaires", type: text }
      - { name: individuel_titre, label: "Cours individuels — titre", type: string }
      - { name: individuel_texte, label: "Cours individuels — texte", type: text }
      - { name: temoignages_titre, label: "Témoignages — titre", type: string }
      - name: temoignages
        label: "Témoignages d'élèves"
        type: object
        list: true
        fields:
          - { name: texte, label: "Témoignage", type: text }
          - { name: auteur, label: "Signature (facultatif)", type: string }
      - { name: cta_titre, label: "Encart final — titre", type: string }
      - { name: cta_texte, label: "Encart final — texte", type: text }

  - name: cartecadeau
    label: "🎁 Page Carte cadeau"
    type: file
    path: src/_data/cartecadeau.json
    fields:
      - { name: titre, label: "Titre de la page", type: string }
      - { name: entete_script, label: "Sous-titre calligraphié", type: string }
      - { name: image, label: "Photo", type: image }
      - { name: intro_titre, label: "Titre d'introduction", type: string }
      - { name: intro_texte, label: "Texte d'introduction", type: text }
      - { name: montants_titre, label: "Montants — titre", type: string }
      - { name: montants, label: "Montants proposés (ex. 15 €)", type: string, list: true }
      - { name: note, label: "Note (comment commander)", type: text }

  - name: quisuisje
    label: "👋 Page Qui suis-je ?"
    type: file
    path: src/_data/quisuisje.json
    fields:
      - { name: titre, label: "Titre de la page", type: string }
      - { name: entete_script, label: "Sous-titre calligraphié", type: string }
      - { name: image, label: "Photo portrait", type: image }
      - { name: intro_titre, label: "Titre d'introduction", type: string }
      - { name: paragraphes, label: "Mon histoire — début (un paragraphe par ligne)", type: text, list: true }
      - { name: citation, label: "Phrase mise en avant (calligraphiée)", type: string }
      - { name: paragraphes_suite, label: "Mon histoire — suite (un paragraphe par ligne)", type: text, list: true }
      - { name: signature, label: "Signature (ex. Aurélia)", type: string }
      - { name: engagements_titre, label: "Engagements — titre", type: string }
      - { name: engagements, label: "Engagements & affiliations (liste)", type: text, list: true }

  - name: contact
    label: "📮 Page Contact"
    type: file
    path: src/_data/contact.json
    fields:
      - { name: titre, label: "Titre de la page", type: string }
      - { name: entete_script, label: "Sous-titre calligraphié", type: string }
      - { name: formulaire_titre, label: "Titre du formulaire", type: string }
      - { name: carte_script, label: "Carte — mot calligraphié", type: string }
      - { name: carte_titre, label: "Carte — titre", type: string }
      - { name: carte_texte, label: "Carte — texte (adresse, accès)", type: text }

  - name: cgv
    label: "📄 CGV"
    type: file
    path: src/cgv.md
    fields:
      - { name: titre, label: "Titre affiché", type: string }
      - { name: body, label: "Contenu", type: rich-text }

  - name: mentions
    label: "📄 Mentions légales"
    type: file
    path: src/mentions-legales.md
    fields:
      - { name: titre, label: "Titre affiché", type: string }
      - { name: body, label: "Contenu", type: rich-text }

  - name: confidentialite
    label: "📄 Politique de confidentialité"
    type: file
    path: src/confidentialite.md
    fields:
      - { name: titre, label: "Titre affiché", type: string }
      - { name: body, label: "Contenu", type: rich-text }
